name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools (betlab itself has no dependencies)
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint
        run: ruff check betlab tests
      - name: Unit, property and golden-number tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          python -m betlab odds -110 -110
          python -m betlab wnba predict --home ATL --away NY --date 2026-10-04 --playoff
          python -m betlab backtest --markets total --price-at open --model-weight 0.35
          python -m betlab tennis price --ml -165 140 --games 22.5 --offer games:over:22.5:-110
          python -m betlab tennis live --p 0.6 --score "6-4 2-3" --points 15-40 --server a
          python -m betlab mlb price --ml +120 -140 --total 8.5 -105 -115 --offer runline:home:-1.5:+150 nrfi:nrfi:0:-120
          python -m betlab mlb price --p-home 0.5 --total 6.5 --postseason --team-totals home:3.5 away:3.5
          python -m betlab liveread --summary tests/fixtures/espn_wnba_live_summary.json --offer ml:away:0:110:dk --sharp ml:-105:-115
          python -m betlab liveread validate
